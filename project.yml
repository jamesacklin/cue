name: Cue
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: '0.1.13'
    CURRENT_PROJECT_VERSION: '15'
targets:
  Cue:
    type: application
    platform: macOS
    sources: [Cue]
    productName: Cue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cueplayer.Minimal
        SWIFT_OBJC_BRIDGING_HEADER: Cue/EqualizerTap.h
        PRODUCT_MODULE_NAME: Cue
        PRODUCT_NAME: Cue
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Cue connects to your selected Plex Media Server to browse and play your music.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CueTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CueTests]
    dependencies:
      - target: Cue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cueplayer.MinimalTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cue:
    build:
      targets:
        Cue: all
    test:
      targets: [CueTests]
