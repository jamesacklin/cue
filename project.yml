name: Cue
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: '0.1.18'
    CURRENT_PROJECT_VERSION: '20'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Cue:
    type: application
    platform: macOS
    sources: [Cue]
    productName: Cue
    dependencies:
      - package: Sparkle
    info:
      path: Cue/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSLocalNetworkUsageDescription: Cue connects to your selected Plex Media Server to browse and play your music.
        SUFeedURL: https://raw.githubusercontent.com/jamesacklin/cue/appcast/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableInstallerLauncherService: true
    entitlements:
      path: Cue/Cue.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cueplayer.Minimal
        SWIFT_OBJC_BRIDGING_HEADER: Cue/EqualizerTap.h
        PRODUCT_MODULE_NAME: Cue
        PRODUCT_NAME: Cue
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CueTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CueTests]
    dependencies:
      - target: Cue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cueplayer.MinimalTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cue:
    build:
      targets:
        Cue: all
    test:
      targets: [CueTests]
